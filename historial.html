<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Peritajes - Perito Expert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .historial-container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .search-bar input { flex: 1; min-width: 200px; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; }
        .search-bar button { padding: 12px 24px; background: #e10600; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .peritaje-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #e10600; }
        .peritaje-card.aprobado { border-left-color: #4CAF50; }
        .peritaje-card.rechazado { border-left-color: #F44336; }
        .peritaje-header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .peritaje-header h3 { margin: 0; color: #15151e; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .badge.aprobado { background: #d4edda; color: #155724; }
        .badge.rechazado { background: #f8d7da; color: #721c24; }
        .peritaje-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; font-size: 13px; color: #555; }
        .peritaje-info span { display: block; }
        .peritaje-info strong { color: #15151e; }
        .btn-ver { display: inline-block; margin-top: 12px; padding: 8px 16px; background: #17a2b8; color: white; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <script>
        if (!localStorage.getItem('perito_user')) window.location.href = 'login.html';
    </script>

    <div class="historial-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:10px;">
            <h1><i class="fas fa-history"></i> Historial de Peritajes</h1>
            <div style="display:flex; gap:10px;">
                <a href="index.html" style="padding:10px 18px; background:#17a2b8; color:white; text-decoration:none; border-radius:8px; font-weight:600;">
                    <i class="fas fa-plus"></i> Nuevo Peritaje
                </a>
                <button onclick="cerrarSesion()" style="padding:10px 18px; background:#6c757d; color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchPlaca" placeholder="Buscar por placa (ej: ABC123)">
            <input type="date" id="searchFecha">
            <button onclick="buscarPorPlaca()"><i class="fas fa-search"></i> Buscar por placa</button>
            <button onclick="buscarPorFecha()"><i class="fas fa-calendar"></i> Buscar por fecha</button>
            <button onclick="cargarTodos()" style="background:#6c757d;"><i class="fas fa-list"></i> Ver todos</button>
        </div>

        <div id="resultados"></div>
    </div>

    <script src="historial.js"></script>
</body>
</html>
