<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Perito Expert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="Logoperito.png" alt="Perito Expert" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <h1 style="display:none;">PERITO EXPERT</h1>
            </div>

            <h2>Iniciar Sesión</h2>
            <p class="login-subtitle">Sistema de Peritaje Automotriz</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="username" placeholder="Ingrese su usuario" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                </div>

                <div class="login-error" id="loginError"></div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
            </form>

            <div class="login-footer">
                <small>© Perito Expert — Sistema de Peritaje Automotriz</small>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
